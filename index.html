<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JOBMITRA INDIA 🇮🇳</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#ff7a00,#ffb000);
  color:white;
  padding:24px 16px;
  text-align:center;
  box-shadow:0 3px 15px rgba(0,0,0,.12);
}

header h1{
  font-size:29px;
  font-weight:800;
}

header p{
  margin-top:7px;
  font-size:14px;
  opacity:.95;
}

.container{
  width:min(1150px,94%);
  margin:20px auto 40px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:white;
  border-radius:14px;
  padding:16px 10px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.stat b{
  display:block;
  font-size:24px;
  color:#ff7200;
}

.stat span{
  display:block;
  margin-top:5px;
  font-size:12px;
  color:#657084;
}

.filters{
  background:white;
  border-radius:16px;
  padding:16px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
  margin-bottom:20px;
}

.search{
  width:100%;
  padding:14px 15px;
  border:1px solid #d9dee8;
  border-radius:11px;
  font-size:15px;
  outline:none;
  margin-bottom:12px;
}

.search:focus,
select:focus{
  border-color:#ff8500;
}

.filter-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

select,
.filter-grid button{
  width:100%;
  padding:12px;
  border:1px solid #d9dee8;
  border-radius:10px;
  background:white;
  font-size:13px;
  outline:none;
}

.filter-grid button{
  background:#172033;
  color:white;
  cursor:pointer;
  font-weight:700;
}

.filter-grid button:hover{
  opacity:.9;
}

.results-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:20px 2px 12px;
}

.results-head h2{
  font-size:20px;
}

#status{
  font-size:12px;
  color:#667085;
}

#results{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.card{
  background:white;
  border-radius:16px;
  padding:17px;
  box-shadow:0 3px 14px rgba(0,0,0,.07);
  border:1px solid #edf0f5;
}

.card h3{
  font-size:17px;
  line-height:1.4;
  margin-bottom:12px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:10px;
}

.tag{
  background:#f0f3f8;
  padding:6px 8px;
  border-radius:7px;
  font-size:11px;
  color:#455066;
}

.tag.source{
  background:#fff1e5;
  color:#d85f00;
}

.tag.type{
  background:#eaf7ee;
  color:#218344;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:12px 0;
}

.info-box{
  background:#f7f9fc;
  border-radius:9px;
  padding:9px;
}

.info-box small{
  display:block;
  color:#7a8495;
  font-size:10px;
  margin-bottom:3px;
}

.info-box strong{
  display:block;
  font-size:12px;
  line-height:1.35;
}

.date{
  font-size:12px;
  color:#5d687a;
  margin:7px 0;
  line-height:1.4;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.actions a,
.actions button{
  text-decoration:none;
  border:0;
  border-radius:9px;
  padding:11px 8px;
  text-align:center;
  font-weight:700;
  font-size:12px;
  cursor:pointer;
}

.details-btn{
  background:#edf2f8;
  color:#243044;
}

.apply-btn{
  background:#ff7200;
  color:white;
}

.loading,
.empty{
  grid-column:1/-1;
  background:white;
  border-radius:15px;
  padding:35px 20px;
  text-align:center;
  color:#687386;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
}

footer{
  text-align:center;
  padding:25px 15px;
  color:#7b8492;
  font-size:12px;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  z-index:1000;
  padding:18px;
  overflow:auto;
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:min(650px,100%);
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:18px;
  padding:20px;
  position:relative;
}

.close{
  position:absolute;
  right:14px;
  top:12px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#f0f2f5;
  font-size:20px;
  cursor:pointer;
}

.modal-box h2{
  padding-right:40px;
  font-size:21px;
  line-height:1.4;
  margin-bottom:14px;
}

.detail-row{
  padding:11px 0;
  border-bottom:1px solid #edf0f4;
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-row label{
  display:block;
  color:#7b8492;
  font-size:11px;
  margin-bottom:4px;
}

.detail-row div{
  font-size:13px;
  line-height:1.5;
  font-weight:600;
}

.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.modal-actions a{
  padding:13px;
  text-align:center;
  border-radius:10px;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
}

.modal-view{
  background:#edf2f8;
  color:#243044;
}

.modal-apply{
  background:#ff7200;
  color:white;
}

@media(max-width:800px){
  .filter-grid{
    grid-template-columns:repeat(2,1fr);
  }

  #results{
    grid-template-columns:1fr;
  }
}

@media(max-width:550px){
  header h1{
    font-size:24px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .filter-grid{
    grid-template-columns:1fr;
  }

  .info{
    grid-template-columns:1fr;
  }

  .results-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .card h3{
    font-size:16px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🇮🇳 JOBMITRA INDIA</h1>
  <p>Government Jobs • Notifications • Results • Admit Cards</p>
</header>

<div class="container">

  <div class="stats">
    <div class="stat">
      <b id="totalCount">0</b>
      <span>Total Records</span>
    </div>

    <div class="stat">
      <b id="jobCount">0</b>
      <span>Jobs</span>
    </div>

    <div class="stat">
      <b id="notificationCount">0</b>
      <span>Notifications</span>
    </div>

    <div class="stat">
      <b id="resultCount">0</b>
      <span>Results</span>
    </div>
  </div>

  <div class="filters">

    <input
      id="search"
      class="search"
      type="text"
      placeholder="🔍 Search job, department, exam, qualification..."
    >

    <div class="filter-grid">

      <select id="stateFilter">
        <option value="">🇮🇳 All States</option>
      </select>

      <select id="departmentFilter">
        <option value="">🏢 All Departments</option>
      </select>

      <select id="sourceFilter">
        <option value="">🏛️ All Sources</option>
      </select>

      <select id="qualificationFilter">
        <option value="">🎓 All Qualifications</option>
      </select>

      <select id="typeFilter">
        <option value="">📋 All Types</option>
      </select>

      <select id="categoryFilter">
        <option value="">📂 All Categories</option>
      </select>

      <select id="sortFilter">
        <option value="newest">🆕 Newest First</option>
        <option value="oldest">📅 Oldest First</option>
        <option value="title">🔤 Title A-Z</option>
      </select>

      <button onclick="clearFilters()">✕ Clear Filters</button>

    </div>
  </div>

  <div class="results-head">
    <h2>📢 Government Opportunities</h2>
    <span id="status">Loading...</span>
  </div>

  <div id="results">
    <div class="loading">
      ⏳ Loading government records...
    </div>
  </div>

</div>

<footer>
  🇮🇳 JOBMITRA INDIA • Government Opportunities Portal
</footer>

<!-- DETAILS MODAL -->

<div id="detailModal" class="modal" onclick="closeModalOutside(event)">
  <div class="modal-box">

    <button class="close" onclick="closeDetails()">×</button>

    <h2 id="modalTitle">Job Details</h2>

    <div id="modalContent"></div>

    <div class="modal-actions">
      <a id="modalView" class="modal-view" href="#" target="_blank" rel="noopener">
        📄 VIEW OFFICIAL
      </a>

      <a id="modalApply" class="modal-apply" href="#" target="_blank" rel="noopener">
        🚀 APPLY NOW
      </a>
    </div>

  </div>
</div>

<script>

const API = "https://jobmitra-india.onrender.com/api/jobs";

let allJobs = [];
let filteredJobs = [];

const searchInput =
  document.getElementById("search");

const stateFilter =
  document.getElementById("stateFilter");

const departmentFilter =
  document.getElementById("departmentFilter");

const sourceFilter =
  document.getElementById("sourceFilter");

const qualificationFilter =
  document.getElementById("qualificationFilter");

const typeFilter =
  document.getElementById("typeFilter");

const categoryFilter =
  document.getElementById("categoryFilter");

const sortFilter =
  document.getElementById("sortFilter");


searchInput.addEventListener("input", applyFilters);
stateFilter.addEventListener("change", applyFilters);
departmentFilter.addEventListener("change", applyFilters);
sourceFilter.addEventListener("change", applyFilters);
qualificationFilter.addEventListener("change", applyFilters);
typeFilter.addEventListener("change", applyFilters);
categoryFilter.addEventListener("change", applyFilters);
sortFilter.addEventListener("change", applyFilters);


async function loadJobs(){

  const status = document.getElementById("status");
  const results = document.getElementById("results");

  try{

    status.textContent = "Connecting...";

    const response = await fetch(API,{
      method:"GET",
      headers:{
        "Accept":"application/json"
      },
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if(Array.isArray(data)){
      allJobs = data;
    }
    else if(Array.isArray(data.jobs)){
      allJobs = data.jobs;
    }
    else if(Array.isArray(data.data)){
      allJobs = data.data;
    }
    else{
      throw new Error("Invalid API response");
    }

    filteredJobs = [...allJobs];

    status.textContent = `${allJobs.length} records`;

    try{
      buildFilters();
    }catch(e){
      console.error("Filter error:", e);
    }

    try{
      updateStats();
    }catch(e){
      console.error("Stats error:", e);
    }

    try{
      applyFilters();
    }catch(e){
      console.error("Render error:", e);
      results.innerHTML = `<div class="empty">Loaded ${allJobs.length} jobs successfully.</div>`;
    }

  }
  catch(error){

    console.error("JOBMITRA LOAD ERROR:", error);

    status.textContent = "Connection failed";

    results.innerHTML = `
      <div class="empty">
        ❌ Unable to load jobs.<br><br>
        ${error.message}
      </div>
    `;
  }
}

function value(job,key){

  return String(job?.[key] ?? "")
    .trim();
}


function getState(job){

  return value(job,"state") ||
         value(job,"location") ||
         "India";
}


function getDepartment(job){

  return value(job,"department") ||
         value(job,"company") ||
         "Government";
}


function getSource(job){

  return value(job,"source") ||
         value(job,"company") ||
         "Government";
}


function getQualification(job){

  return value(job,"qualification") ||
         "See official notification";
}


function getType(job){

  return value(job,"type") ||
         "Government";
}


function getCategory(job){

  return value(job,"category") ||
         "Job";
}


function uniqueValues(getter){

  return [...new Set(
    allJobs
      .map(getter)
      .map(x => x.trim())
      .filter(Boolean)
  )].sort((a,b)=>
    a.localeCompare(b)
  );
}


function populateSelect(select,firstOption,values){

  select.innerHTML =
    `<option value="">${firstOption}</option>` +
    values.map(x =>
      `<option value="${escapeHtml(x)}">
        ${escapeHtml(x)}
      </option>`
    ).join("");
}


function buildFilters(){

  populateSelect(
    stateFilter,
    "🇮🇳 All States",
    uniqueValues(getState)
  );

  populateSelect(
    departmentFilter,
    "🏢 All Departments",
    uniqueValues(getDepartment)
  );

  populateSelect(
    sourceFilter,
    "🏛️ All Sources",
    uniqueValues(getSource)
  );

  populateSelect(
    qualificationFilter,
    "🎓 All Qualifications",
    [
      "10th",
      "Inter / 12th",
      "ITI",
      "Diploma",
      "Degree / Graduate",
      "Post Graduate",
      "PhD",
      "Professional"
    ]
  );

  populateSelect(
    typeFilter,
    "📋 All Types",
    uniqueValues(getType)
  );

  populateSelect(
    categoryFilter,
    "📂 All Categories",
    uniqueValues(getCategory)
  );
}


function applyFilters(){

  const q =
    searchInput.value
      .trim()
      .toLowerCase();

  const state =
    stateFilter.value.toLowerCase();

  const department =
    departmentFilter.value.toLowerCase();

  const source =
    sourceFilter.value.toLowerCase();

  const qualification =
    qualificationFilter.value.toLowerCase();

  const type =
    typeFilter.value.toLowerCase();

  const category =
    categoryFilter.value.toLowerCase();


  filteredJobs = allJobs.filter(job => {

    const text = [

      job.title,
      job.company,
      job.department,
      job.location,
      job.state,
      job.category,
      job.source,
      job.type,
      job.qualification,
      job.notificationNumber,
      job.vacancies

    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();


    const matchesSearch =
      !q || text.includes(q);


    const matchesState =
      !state ||
      getState(job).toLowerCase() === state;


    const matchesDepartment =
      !department ||
      getDepartment(job).toLowerCase() === department;


    const matchesSource =
      !source ||
      getSource(job).toLowerCase() === source;


    const jobQual = getQualification(job).toLowerCase();

    const matchesQualification =
      !qualification ||
      (qualification === "10th" &&
        /10th|matric|ssc|secondary/.test(jobQual)) ||
      (qualification === "inter / 12th" &&
        /inter|12th|intermediate|higher secondary|plus ?2/.test(jobQual)) ||
      (qualification === "iti" &&
        /iti/.test(jobQual)) ||
      (qualification === "diploma" &&
        /diploma|polytechnic/.test(jobQual)) ||
      (qualification === "degree / graduate" &&
        /degree|graduate|graduation|b\.?tech|b\.?e\.?|b\.?sc|b\.?com|b\.?a\.?|bachelor/.test(jobQual)) ||
      (qualification === "post graduate" &&
        /post graduate|postgraduate|pg|master|m\.?a\.?|m\.?sc|m\.?com|m\.?tech|m\.?e\.?|mba|mca/.test(jobQual)) ||
      (qualification === "phd" &&
        /phd|doctorate/.test(jobQual)) ||
      (qualification === "professional" &&
        /ca|cma|cs|llb|llm|mbbs|bds|engineering|professional/.test(jobQual));

    const matchesType =
      !type ||
      getType(job).toLowerCase() === type;


    const matchesCategory =
      !category ||
      getCategory(job).toLowerCase() === category;


    return (
      matchesSearch &&
      matchesState &&
      matchesDepartment &&
      matchesSource &&
      matchesQualification &&
      matchesType &&
      matchesCategory
    );

  });


  sortJobs();

  renderJobs();

  document.getElementById("status").textContent =
    `${filteredJobs.length} of ${allJobs.length} records`;
}


function sortJobs(){

  const mode = sortFilter.value;

  filteredJobs.sort((a,b)=>{

    if(mode === "title"){

      return String(a.title || "")
        .localeCompare(
          String(b.title || "")
        );
    }


    const da = getDateValue(a);
    const db = getDateValue(b);


    if(mode === "oldest"){
      return da - db;
    }

    return db - da;
  });
}


function getDateValue(job){

  const dates = [
    job.updatedAt,
    job.createdAt,
    job.notificationDate,
    job.lastDate,
    job.applicationLastDate
  ];

  for(const d of dates){

    if(d){

      const time =
        new Date(d).getTime();

      if(!Number.isNaN(time)){
        return time;
      }
    }
  }

  return 0;
}


function updateStats(){

  document.getElementById("totalCount").textContent =
    allJobs.length;


  document.getElementById("jobCount").textContent =
    allJobs.filter(j =>
      getCategory(j)
        .toLowerCase()
        .includes("job")
    ).length;


  document.getElementById("notificationCount").textContent =
    allJobs.filter(j =>
      getCategory(j)
        .toLowerCase()
        .includes("notification")
    ).length;


  document.getElementById("resultCount").textContent =
    allJobs.filter(j =>
      getCategory(j)
        .toLowerCase()
        .includes("result")
    ).length;
}


function renderJobs(){

  const box =
    document.getElementById("results");


  if(filteredJobs.length === 0){

    box.innerHTML = `
      <div class="empty">
        🔍 No matching government records found.
      </div>
    `;

    return;
  }


  box.innerHTML =
    filteredJobs
      .slice(0,100)
      .map((job,index)=>
        createCard(job,index)
      )
      .join("");


  if(filteredJobs.length > 100){

    box.innerHTML += `
      <div class="empty">
        Showing first 100 records.<br>
        Use search or filters to narrow results.
      </div>
    `;
  }
}


function createCard(job,index){

  const title =
    job.title ||
    "Government Opportunity";


  const company =
    job.company ||
    "Government Department";


  const location =
    job.location ||
    job.state ||
    "India";


  const source =
    getSource(job);


  const type =
    getType(job);


  const department =
    getDepartment(job);


  const qualification =
    getQualification(job);


  const vacancies =
    job.vacancies ||
    "See notification";


  const salary =
    job.salary ||
    "See official notification";


  const lastDate =
    job.applicationLastDate ||
    job.lastDate ||
    "See official notification";


  const notification =
    job.notificationNumber ||
    "";


  const url =
    job.url ||
    job.sourceUrl ||
    "#";


  const applyUrl =
    job.applyUrl ||
    job.applicationUrl ||
    url ||
    "#";


  return `

    <div class="card">

      <h3>
        ${escapeHtml(title)}
      </h3>


      <div class="meta">

        <span class="tag source">
          🏛️ ${escapeHtml(source)}
        </span>

        <span class="tag type">
          📋 ${escapeHtml(type)}
        </span>

        <span class="tag">
          📍 ${escapeHtml(location)}
        </span>

      </div>


      <div class="date">
        🏢 <b>Department:</b>
        ${escapeHtml(department)}
      </div>


      <div class="info">

        <div class="info-box">
          <small>🎓 Qualification</small>
          <strong>
            ${escapeHtml(qualification)}
          </strong>
        </div>


        <div class="info-box">
          <small>👥 Vacancies</small>
          <strong>
            ${escapeHtml(vacancies)}
          </strong>
        </div>


        <div class="info-box">
          <small>💰 Salary</small>
          <strong>
            ${escapeHtml(salary)}
          </strong>
        </div>


        <div class="info-box">
          <small>📂 Category</small>
          <strong>
            ${escapeHtml(getCategory(job))}
          </strong>
        </div>

      </div>


      ${
        notification
        ?
        `
        <div class="date">
          📝 Notification:
          ${escapeHtml(notification)}
        </div>
        `
        :
        ""
      }


      <div class="date">
        ⏰ Last Date:
        <b>${escapeHtml(lastDate)}</b>
      </div>


      <div class="actions">

        <button
          class="details-btn"
          onclick="showDetails(${index})"
        >
          📄 VIEW DETAILS
        </button>


        ${
          applyUrl &&
          applyUrl !== "#"
          ?
          `
          <a
            href="${safeUrl(applyUrl)}"
            target="_blank"
            rel="noopener"
            class="apply-btn"
          >
            🚀 APPLY NOW
          </a>
          `
          :
          `
          <button
            class="apply-btn"
            disabled
          >
            🚫 APPLY LINK
          </button>
          `
        }

      </div>

    </div>

  `;
}


function showDetails(index){

  const job =
    filteredJobs[index];


  if(!job){
    return;
  }


  document.getElementById("modalTitle")
    .textContent =
      job.title ||
      "Government Opportunity";


  const fields = [

    ["🏢 Company",job.company],

    ["🏛️ Department",getDepartment(job)],

    ["📍 Location",job.location || job.state],

    ["🇮🇳 State",job.state],

    ["🏛️ Source",getSource(job)],

    ["📋 Type",getType(job)],

    ["📂 Category",getCategory(job)],

    ["🎓 Qualification",getQualification(job)],

    ["👥 Vacancies",job.vacancies],

    ["💰 Salary",job.salary],

    ["⏰ Last Date",
      job.applicationLastDate ||
      job.lastDate],

    ["📝 Notification Number",
      job.notificationNumber]

  ];


  document.getElementById("modalContent")
    .innerHTML =
      fields
        .filter(([label,val]) =>
          val !== undefined &&
          val !== null &&
          String(val).trim() !== ""
        )
        .map(([label,val]) => `
          <div class="detail-row">

            <label>
              ${escapeHtml(label)}
            </label>

            <div>
              ${escapeHtml(val)}
            </div>

          </div>
        `)
        .join("");


  const officialUrl =
    job.url ||
    job.sourceUrl ||
    "#";


  const applyUrl =
    job.applyUrl ||
    job.applicationUrl ||
    officialUrl ||
    "#";


  const view =
    document.getElementById("modalView");


  const apply =
    document.getElementById("modalApply");


  view.href =
    safeUrl(officialUrl);


  apply.href =
    safeUrl(applyUrl);


  view.style.display =
    officialUrl !== "#"
    ? "block"
    : "none";


  apply.style.display =
    applyUrl !== "#"
    ? "block"
    : "none";


  document.getElementById("detailModal")
    .classList.add("show");
}


function closeDetails(){

  document.getElementById("detailModal")
    .classList.remove("show");
}


function closeModalOutside(event){

  if(event.target.id === "detailModal"){
    closeDetails();
  }
}


document.addEventListener("keydown",event=>{

  if(event.key === "Escape"){
    closeDetails();
  }

});


function clearFilters(){

  searchInput.value = "";

  stateFilter.value = "";

  departmentFilter.value = "";

  sourceFilter.value = "";

  qualificationFilter.value = "";

  typeFilter.value = "";

  categoryFilter.value = "";

  sortFilter.value = "newest";

  applyFilters();
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function safeUrl(value){

  try{

    const u =
      new URL(
        value,
        window.location.href
      );


    if(
      u.protocol === "http:" ||
      u.protocol === "https:"
    ){

      return u.href;
    }


    return "#";

  }
  catch{

    return "#";
  }
}


loadJobs();
