<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JOBMITRA INDIA 🇮🇳</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fa;
  color:#172033;
}
header{
  background:linear-gradient(135deg,#0b1f3a,#1261a0);
  color:white;
  padding:18px 14px 20px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 3px 15px #0003;
}
.brand{
  font-size:25px;
  font-weight:800;
}
.live{
  color:#55ff86;
  font-size:13px;
  margin-left:6px;
}
.subtitle{
  margin-top:5px;
  font-size:14px;
  opacity:.9;
}
.searchbox{
  display:flex;
  margin-top:15px;
  gap:8px;
}
.searchbox input{
  flex:1;
  padding:13px 14px;
  border:0;
  border-radius:10px;
  font-size:15px;
  outline:none;
}
.searchbox button{
  border:0;
  border-radius:10px;
  padding:0 16px;
  font-size:20px;
}
.nav{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-top:13px;
  padding-bottom:2px;
}
.nav button{
  white-space:nowrap;
  border:1px solid #ffffff44;
  background:#ffffff18;
  color:white;
  padding:9px 12px;
  border-radius:20px;
  font-size:13px;
}
.nav button.active{
  background:white;
  color:#0b1f3a;
  font-weight:bold;
}
.container{
  max-width:950px;
  margin:auto;
  padding:15px;
}
.filters{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-bottom:14px;
}
select{
  width:100%;
  padding:11px;
  border:1px solid #d5dce5;
  border-radius:9px;
  background:white;
}
.status{
  font-weight:bold;
  margin:10px 0 13px;
}
.card{
  background:white;
  border-radius:14px;
  padding:16px;
  margin-bottom:13px;
  box-shadow:0 2px 10px #00000012;
  border:1px solid #e4e9ef;
}
.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:15px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:9px;
  background:#edf2f7;
}
.title{
  font-size:18px;
  font-weight:800;
  line-height:1.35;
  margin-bottom:10px;
}
.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  font-size:13px;
  color:#4a5568;
}
.info div{
  background:#f7f9fb;
  padding:8px;
  border-radius:7px;
}
.actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}
.actions a,.detailsBtn{
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:9px;
  text-decoration:none;
  font-weight:bold;
  border:0;
  cursor:pointer;
  font-size:13px;
}
.detailsBtn{
  background:#e9f1fb;
  color:#145da0;
}
.apply{
  background:#1261a0;
  color:white;
}
.empty{
  text-align:center;
  padding:40px 15px;
  background:white;
  border-radius:14px;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  padding:18px;
  overflow:auto;
}
.modalBox{
  max-width:650px;
  margin:30px auto;
  background:white;
  border-radius:16px;
  padding:20px;
}
.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px;
  font-size:20px;
}
.modalTitle{
  font-size:21px;
  font-weight:800;
  padding-right:40px;
  line-height:1.35;
}
.detailRow{
  margin-top:10px;
  padding:11px;
  background:#f5f7fa;
  border-radius:8px;
}
.detailRow b{
  display:block;
  font-size:12px;
  color:#687386;
  margin-bottom:3px;
}
footer{
  text-align:center;
  padding:25px 10px;
  color:#667085;
  font-size:13px;
}
@media(max-width:650px){
  .filters{grid-template-columns:1fr}
  .info{grid-template-columns:1fr}
  .title{font-size:17px}
}
</style>
</head>

<body>

<header>
  <div class="brand">💼 JOBMITRA INDIA 🇮🇳 <span class="live">● LIVE</span></div>
  <div class="subtitle">Government Jobs & Updates 🇮🇳</div>
  <div class="subtitle">Jobs • Notifications • Results • Admit Cards</div>

  <div class="searchbox">
    <input id="search" type="search"
      placeholder="Search job, department, post...">
    <button onclick="render()">🔍</button>
  </div>

  <div class="nav">
    <button class="active" onclick="setCategory('ALL',this)">🏠 All</button>
    <button onclick="setCategory('JOB',this)">💼 Jobs</button>
    <button onclick="setCategory('NOTIFICATION',this)">📢 Notifications</button>
    <button onclick="setCategory('RESULT',this)">📝 Results</button>
    <button onclick="setCategory('ADMIT CARD',this)">🎫 Admit Cards</button>
  </div>
</header>

<main class="container">

  <div class="filters">
    <select id="qualification" onchange="render()">
      <option value="">All Qualifications</option>
    </select>

    <select id="state" onchange="render()">
      <option value="">All States</option>
    </select>

    <select id="source" onchange="render()">
      <option value="">All Sources</option>
    </select>
  </div>

  <div id="status" class="status">🔄 Loading...</div>
  <div id="jobs"></div>

</main>

<footer>
  <b>JOBMITRA INDIA 🇮🇳</b><br>
  Government Jobs • Notifications • Admit Cards • Results<br><br>
  🔄 Automatic Job Updates Every 10 Minutes
</footer>

<div class="modal" id="modal">
  <div class="modalBox">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>

const API = "http://127.0.0.1:3000/api/jobs";

let allJobs = [];
let category = "ALL";

function safe(v){
  return v === undefined || v === null || v === "" ?
    "See official notification" : String(v);
}

function normalizeJob(j){
  return {
    title:safe(j.title || j.name || j.jobTitle || j.post),
    organization:safe(
      j.organization || j.company || j.department
    ),
    department:safe(j.department),
    location:safe(j.location || j.state || "India"),
    qualification:safe(
      j.qualification || j.eligibility || j.education
    ),
    vacancies:safe(
      j.vacancies || j.posts || j.totalPosts
    ),
    salary:safe(j.salary),
    source:safe(
      j.source || j.portal || j.website
    ),
    type:safe(
      j.category || j.type || j.jobType || "JOB"
    ).toUpperCase(),
    lastDate:safe(
      j.lastDate || j.deadline || j.applicationLastDate
    ),
    description:safe(j.description || j.summary),
    url:j.applyUrl || j.sourceUrl || j.url || j.link || "#",
    updatedAt:j.updatedAt || j.createdAt || ""
  };
}

function getType(j){

  let t = (
    j.category ||
    j.type ||
    ""
  ).toUpperCase();

  if(t.includes("RESULT")) return "RESULT";
  if(t.includes("ADMIT")) return "ADMIT CARD";
  if(t.includes("NOTIFICATION") || t.includes("NOTICE"))
    return "NOTIFICATION";

  return "JOB";
}

function icon(type){
  if(type==="RESULT") return "📝";
  if(type==="ADMIT CARD") return "🎫";
  if(type==="NOTIFICATION") return "📢";
  return "💼";
}

function setCategory(value,btn){

  category=value;

  document.querySelectorAll(".nav button")
    .forEach(b=>b.classList.remove("active"));

  btn.classList.add("active");

  render();
}

function fillFilters(){

  const qualifications = [...new Set(
    allJobs.map(j=>j.qualification)
      .filter(v=>v && v!=="See official notification")
  )].sort();

  const states = [...new Set(
    allJobs.map(j=>j.location)
      .filter(v=>v && v!=="See official notification")
  )].sort();

  const sources = [...new Set(
    allJobs.map(j=>j.source)
      .filter(v=>v && v!=="See official notification")
  )].sort();

  const q=document.getElementById("qualification");
  const s=document.getElementById("state");
  const so=document.getElementById("source");

  q.innerHTML='<option value="">All Qualifications</option>';
  s.innerHTML='<option value="">All States</option>';
  so.innerHTML='<option value="">All Sources</option>';

  qualifications.forEach(v=>{
    q.innerHTML += `<option value="${esc(v)}">${esc(v)}</option>`;
  });

  states.forEach(v=>{
    s.innerHTML += `<option value="${esc(v)}">${esc(v)}</option>`;
  });

  sources.forEach(v=>{
    so.innerHTML += `<option value="${esc(v)}">${esc(v)}</option>`;
  });
}

function render(){

  const search=document.getElementById("search")
    .value.toLowerCase().trim();

  const q=document.getElementById("qualification").value;
  const state=document.getElementById("state").value;
  const source=document.getElementById("source").value;

  let filtered=allJobs.filter(j=>{

    const type=getType(j);

    if(category!=="ALL" && type!==category)
      return false;

    if(q && j.qualification!==q)
      return false;

    if(state && j.location!==state)
      return false;

    if(source && j.source!==source)
      return false;

    if(search){

      const text=[
        j.title,
        j.organization,
        j.department,
        j.location,
        j.qualification,
        j.source
      ].join(" ").toLowerCase();

      if(!text.includes(search))
        return false;
    }

    return true;
  });

  document.getElementById("status").innerHTML =
    `Latest Government Updates <b>${filtered.length}</b> Updates 🟢`;

  const box=document.getElementById("jobs");

  if(!filtered.length){

    box.innerHTML=`
      <div class="empty">
        🔎<br><br>
        <b>No matching jobs found.</b><br>
        Try another search or filter.
      </div>
    `;

    return;
  }

  box.innerHTML=filtered.map((j,i)=>{

    const type=getType(j);

    return `
      <article class="card">

        <div class="badge">
          ${icon(type)} ${esc(type)}
        </div>

        <div class="title">
          ${esc(j.title)}
        </div>

        <div class="info">

          <div>🏛️ <b>${esc(j.organization)}</b></div>

          <div>📍 ${esc(j.location)}</div>

          <div>🎓 ${esc(j.qualification)}</div>

          <div>👥 ${esc(j.vacancies)}</div>

          <div>🌐 ${esc(j.source)}</div>

          <div>📅 Last Date: ${esc(j.lastDate)}</div>

        </div>

        <div class="actions">

          <button class="detailsBtn"
            onclick="showDetails(${i},${JSON.stringify(filtered).replace(/"/g,'&quot;')})">
            📄 View Details
          </button>

          <a class="apply"
            href="${esc(j.url)}"
            target="_blank"
            rel="noopener">
            🌐 Official Details
          </a>

        </div>

      </article>
    `;

  }).join("");
}

function showDetails(index,data){

  const j=data[index];

  document.getElementById("modalContent").innerHTML=`

    <div class="modalTitle">
      ${esc(j.title)}
    </div>

    <div class="detailRow">
      <b>ORGANIZATION</b>
      ${esc(j.organization)}
    </div>

    <div class="detailRow">
      <b>DEPARTMENT</b>
      ${esc(j.department)}
    </div>

    <div class="detailRow">
      <b>LOCATION</b>
      ${esc(j.location)}
    </div>

    <div class="detailRow">
      <b>QUALIFICATION</b>
      ${esc(j.qualification)}
    </div>

    <div class="detailRow">
      <b>VACANCIES</b>
      ${esc(j.vacancies)}
    </div>

    <div class="detailRow">
      <b>SALARY</b>
      ${esc(j.salary)}
    </div>

    <div class="detailRow">
      <b>CATEGORY</b>
      ${esc(getType(j))}
    </div>

    <div class="detailRow">
      <b>SOURCE</b>
      ${esc(j.source)}
    </div>

    <div class="detailRow">
      <b>LAST DATE</b>
      ${esc(j.lastDate)}
    </div>

    <div class="detailRow">
      <b>DESCRIPTION</b>
      ${esc(j.description)}
    </div>

    <br>

    <a class="apply"
      style="display:block"
      href="${esc(j.url)}"
      target="_blank"
      rel="noopener">
      🌐 OPEN OFFICIAL DETAILS
    </a>
  `;

  document.getElementById("modal").style.display="block";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function esc(v){

  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function loadJobs(){

  const status=document.getElementById("status");

  try{

    status.innerHTML="🔄 Connecting to JOBMITRA backend...";

    const response=await fetch(API,{
      cache:"no-store"
    });

    if(!response.ok)
      throw new Error("HTTP "+response.status);

    const data=await response.json();

    if(!Array.isArray(data))
      throw new Error("Invalid API data");

    allJobs=(Array.isArray(data)?data:data.jobs||[]).map(normalizeJob);

    fillFilters();
    render();

  }catch(error){

    console.error(error);

    status.innerHTML="❌ Unable to load jobs.";

    document.getElementById("jobs").innerHTML=`
      <div class="empty">
        ❌ <b>Backend connection failed.</b><br><br>
        Please make sure JOBMITRA backend is running.<br><br>
        <small>API: localhost:3000/api/jobs</small>
      </div>
    `;
  }
}

document.getElementById("search")
  .addEventListener("input",render);

window.addEventListener("click",function(e){
  if(e.target===document.getElementById("modal"))
    closeModal();
});

loadJobs();

setInterval(loadJobs,600000);

</script>

</body>
</html>
